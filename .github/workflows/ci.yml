# Testes com banco — porque sem banco 44% da suíte não roda.
#
# Não havia CI neste repositório, e o efeito não era "os testes não rodam
# automaticamente": era que **os testes que mais importam nunca rodaram**. As
# suítes deste produto se dividem em duas naturezas, e a divisão não é acidental.
# As puras cobrem parsing, ranqueamento e redação; as `-real` e a bateria do
# assistente cobrem o que só existe contra dado promovido — se o número que o
# assistente cita é o mesmo que a tela mostra, se a comparação entre vigências
# bate com o motor, se a identidade canônica se mantém entre importações.
#
# Sem `DATABASE_URL`, as segundas se marcam como puladas e o resultado fica
# verde. Medido em 15/08/2026: **420 de 963 testes pulados**, com `balance` e
# `db` pulando 100% do que têm. A bateria do assistente — 73 provas — nunca
# rodou desde que foi escrita, e apodreceu: uma delas falhava contra um rótulo
# que o código havia mudado, e ninguém soube.
#
# Este arquivo existe para que "verde" queira dizer a mesma coisa que dizia
# quando alguém rodava à mão com um banco ao lado.
#
# ---------------------------------------------------------------------------
# A bateria roda em jobs paralelos, e a divisão não é arbitrária
# ---------------------------------------------------------------------------
#
# Era um job só, sequencial, de ~11 minutos, com o passo de testes respondendo
# por 90% disso. Três medições explicaram onde o tempo ia, e as três foram
# corrigidas antes deste arquivo mudar:
#
#   1. `pnpm -r run test` ordena topologicamente por padrão, e o grafo aqui é
#      uma corrente de oito níveis. A ordem não comprava nada — todo pacote
#      exporta TypeScript-fonte, nenhum `test` consome build de outro — e
#      custava o caminho crítico inteiro. `--no-sort` no script `test`.
#   2. Sete pacotes traziam `fileParallelism: false`, que no vitest 3 é
#      literalmente `maxWorkers = 1`.
#   3. Dezesseis arquivos reconstruíam a mesma base real no `beforeAll`. Agora
#      o preparo caro roda uma vez e cada suíte **clona** um banco-template.
#
# O que sobrou é este arquivo. A divisão em shards mora em
# `scripts/ci/shards.mjs`, e não aqui, por dois motivos:
#
# **Localidade de template.** As suítes que partem de dado real clonam um
# template que vive no Postgres *daquele job*. Espalhar `comparison`,
# `curation`, `composition` e `dre` por jobs diferentes faria cada um
# reconstruir o mesmo template — 26 s medidos, quatro vezes. Por isso a divisão
# é primeiro por template compartilhado e só depois por peso, e por isso ela
# **não** usa o `--shard` do vitest, que distribui arquivos por hash do caminho
# e desfaria exatamente esse ganho.
#
# **Um pacote fora de todo shard não roda, e ninguém vê.** É a mesma classe de
# defeito que produziu os 420 pulados. `scripts/__tests__/shards.test.mjs`
# reprova quem criar um pacote com testes sem dizer em que job ele roda — e ela
# roda junto com a suíte, no shard `unit`, não como etapa opcional.

name: CI

# ---------------------------------------------------------------------------
# Um gatilho, e não dois — porque dois rodavam a bateria inteira duas vezes
# ---------------------------------------------------------------------------
#
# Havia `push` **e** `pull_request`. Um branch com PR aberto disparava os dois a
# cada envio, e o `concurrency` abaixo não os fundia: o grupo é por
# `github.ref`, e os dois eventos têm refs diferentes — `refs/heads/<branch>` no
# push, `refs/pull/<n>/merge` no pull_request. Dois grupos, duas execuções, as
# duas ao mesmo tempo.
#
# O custo não era só de minutos de runner. Cada execução sobe o seu próprio
# container de Postgres, e as duas disputavam o mesmo pool: em 19/08/2026, no
# commit 19f6b59, o shard `unit` **passou** na execução do push e **reprovou** na
# do pull_request — mesmo SHA, mesma suíte, 114s contra 72s, terminando em
# `unexpected EOF on client connection with an open transaction`, que é processo
# morto no meio e não asserção reprovada. A duplicação não estava só gastando
# tempo; estava fabricando vermelho.
#
# `push: ["**"]` é o que fica, e não `push: [main] + pull_request`, por causa de
# como se trabalha aqui: um branch vive dias antes de virar PR, e trocar o push
# pelo pull_request deixaria justamente esse período sem bateria nenhuma. Os
# checks de um push aparecem no PR do mesmo jeito — o GitHub os associa pelo
# SHA, não pelo evento.
#
# **O que se perde, dito por extenso.** (1) O `pull_request` roda sobre o merge
# com a base, e o `push` roda sobre o branch como ele está: um branch verde e
# atrasado em relação à `main` pode entrar vermelho. A prática desta casa já
# cobre isso — todo branch integra a `main` antes de mergear, e o histórico é
# feito desses commits ("Integra main: …"). (2) Um PR vindo de fork não dispara
# `push` neste repositório e passaria a não ter bateria nenhuma. Isso falha para
# o lado visível, e é por isso que é aceitável: sem execução, o check `CI
# completo` não existe — a proteção de branch que o exija barra o merge, e onde
# não houver proteção o PR aparece **sem check nenhum**. O que não acontece em
# nenhum dos dois casos é o verde falso, que é o que este arquivo existe para
# impedir. No dia em que um fork precisar de bateria, o caminho é acrescentar
# um workflow próprio para `pull_request_target` — e não devolver o gatilho
# `pull_request` aqui, que traria a duplicação de volta inteira.
on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Duas variáveis, porque são dois modos de teste — e a diferença importa.
  #
  # `TEST_ADMIN_DATABASE_URL` é a conexão de administração: as suítes que falam
  # com banco criam um descartável por arquivo, a partir das migrations
  # versionadas. Elas não querem o banco semeado; querem um vazio que prove que
  # as migrations sobem.
  #
  # `ASSISTANT_EVAL_DATABASE_URL` é o banco **semeado**: a bateria e o benchmark
  # do assistente precisam do export real promovido, porque o que eles conferem
  # é se o número que o assistente cita é o mesmo que o motor devolve. Só o
  # shard `assistente` paga esse seed — os outros criam os seus próprios bancos
  # e não têm o que fazer com ele.
  #
  # `DATABASE_URL` fica de fora de propósito. Uma rota do api-server testa
  # exatamente o que acontece quando ela **não** está definida, e defini-la aqui
  # faria esse teste medir o ambiente em vez do código. O seed a recebe inline.
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?application_name=ci
  ASSISTANT_EVAL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/freightcheck

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versão vem do `packageManager` no package.json — que é onde ela
      # também vale para quem roda o projeto na máquina, via corepack. Sem ela
      # declarada em algum dos dois lugares, esta action falha antes de instalar
      # qualquer coisa, e foi assim que este workflow reprovou cinco vezes
      # seguidas sem nunca ter chegado a rodar um teste.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # Não depende de banco, e por isso não espera por um. Era o segundo passo
      # de um job de onze minutos; agora responde sozinho em ~30 s.
      - name: Typecheck
        run: pnpm run typecheck

  testes:
    name: Testes (${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      # Um shard vermelho não cancela os outros: quem lê o resultado quer saber
      # tudo o que quebrou, não a primeira coisa que quebrou.
      fail-fast: false
      matrix:
        shard: [unit, ingest, curado, balance, assistente]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freightcheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # Calar o log de checkpoint do Postgres — senão nenhuma falha é legível
      # -----------------------------------------------------------------------
      #
      # A suíte cria e derruba um banco por arquivo de teste, e cada `CREATE
      # DATABASE`/`DROP DATABASE` força um checkpoint. Com `log_checkpoints` no
      # padrão (`on`, no Postgres 16), o container despeja duas linhas por
      # checkpoint — medido em ~11 linhas por segundo, ~1900 das 1970 linhas de
      # um job de quatro minutos.
      #
      # O efeito não é cosmético. O log do serviço é impresso todo de uma vez no
      # fim do job, então ele **empurra a saída do vitest para fora do alcance**:
      # quem lê a falha pela API do GitHub recebe a cauda, e a cauda é só
      # `checkpoint complete`. Foi exatamente o que impediu o diagnóstico de uma
      # reprovação do shard `unit` em 04/09/2026 — o job dizia que algo falhou e
      # não havia como saber o quê sem abrir a página no navegador.
      #
      # **Por `ALTER SYSTEM`, e não pelas `options` do serviço.** As `options` de
      # um service container são flags do `docker create`: `-c` ali é
      # `--cpu-shares`, e passar `-c log_checkpoints=off` derruba o container em
      # vez de configurar o Postgres. O GitHub não oferece `command` para
      # serviços, então a configuração entra depois de o banco estar de pé.
      # `log_checkpoints` é de contexto `sighup`, então o reload basta — não há
      # restart nem janela sem banco.
      #
      # **E o eco do statement sai junto**, por `log_min_error_statement`. Tirado
      # o checkpoint, o que sobrou de volume foi ele: o Postgres reimprime o
      # comando que falhou, e aqui esse comando costuma ser uma migration
      # inteira — cem linhas de SQL comentado por erro. Pior, quase todos esses
      # erros são **de propósito**: são os testes provando que a imutabilidade
      # da camada RAW recusa o UPDATE, que a competência encerrada recusa a
      # escrita, que a FK segura a exclusão. Cada guarda que funciona custava
      # cem linhas de log.
      #
      # Só o ruído sai. A mensagem do `ERROR` continua, com `DETAIL`, `HINT` e
      # `CONTEXT` — é ela que diz o que aconteceu. O que deixa de ser reimpresso
      # é o texto do comando, que em teste é conhecido e em migration está no
      # arquivo.
      #
      # **Este passo não pode reprovar o job.** Ele melhora a legibilidade do
      # log e mais nada; um `psql` ausente numa imagem futura de runner viraria
      # uma reprovação que não fala sobre o código — o oposto do que ele existe
      # para fazer. Sem `psql`, segue em frente e diz que seguiu.
      - name: Calar o log de checkpoint do Postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql não está neste runner — o log do Postgres fica como está."
            exit 0
          fi
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_checkpoints = off" \
            -c "ALTER SYSTEM SET log_min_error_statement = panic" \
            -c "SELECT pg_reload_conf()"

      # Migrations e os dois workbooks reais de `attached_assets`. É o mesmo
      # caminho que um desenvolvedor roda para ter um banco de trabalho, e é de
      # propósito: um seed exclusivo de CI seria uma segunda verdade sobre o que
      # "banco pronto" significa.
      #
      # Quem precisa dele está declarado em `scripts/ci/shards.mjs`, e não
      # repetido aqui: um `if` escrito à mão neste arquivo é a forma mais fácil
      # de o assistente passar a rodar sem banco e ficar verde pulando tudo.
      - name: Semear o banco (só o shard que precisa)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/freightcheck
        run: |
          if node scripts/ci/shards.mjs precisa-seed "${{ matrix.shard }}"; then
            pnpm run dev:seed
          else
            echo "shard ${{ matrix.shard }} não usa o banco semeado — pulando"
          fi

      - name: Testes
        run: |
          pnpm -r --if-present --no-sort \
            $(node scripts/ci/shards.mjs filtros "${{ matrix.shard }}") \
            run test

      # A régua do assistente. O piso por categoria está no próprio teste, e
      # cair abaixo dele reprova aqui.
      #
      # `exec vitest run <caminho>`, e não `run test -- <caminho>`: o `--` do
      # pnpm chega ao vitest como argumento solto, que ele ignora como filtro. O
      # passo rodava a suíte inteira do assistente de novo, e dizia no nome que
      # rodava só o benchmark.
      - name: Benchmark do assistente
        if: matrix.shard == 'assistente'
        run: pnpm --filter @workspace/assistant exec vitest run src/__tests__/benchmark

  # Um check só para a proteção de branch apontar, em vez de cinco nomes que
  # mudam sempre que a divisão muda.
  #
  # `if: always()` para que ele rode mesmo quando um shard reprova — sem isso
  # ele seria pulado junto, e um job pulado conta como não-reprovado nas regras
  # de proteção, que é precisamente o falso verde que este arquivo existe para
  # impedir. A conferência é explícita contra `success` e não contra
  # `!= failure`: cancelado e pulado também não são passar.
  ci:
    name: CI completo
    if: always()
    needs: [typecheck, testes]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que typecheck e todos os shards tenham passado
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "testes:    ${{ needs.testes.result }}"
          [ "${{ needs.typecheck.result }}" = "success" ] || exit 1
          [ "${{ needs.testes.result }}" = "success" ] || exit 1
