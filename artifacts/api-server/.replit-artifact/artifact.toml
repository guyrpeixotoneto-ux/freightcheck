kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

# É este bloco que diz ao serviço em qual porta subir, e ele faltava aqui — os
# outros dois artifacts sempre tiveram o seu. `src/index.ts` exige PORT e sem
# ele o processo morre na primeira linha, então nunca houve nada escutando na
# 8080. O roteador continuava encaminhando `/api` para lá e devolvendo 502 sem
# corpo: a tela abria, e só as chamadas de API falhavam. A PORT que existia
# estava em `[services.production.run.env]`, que não vale em desenvolvimento.
# Este número e o `localPort` acima são o mesmo endereço e mudam juntos.
[services.env]
PORT = "8080"

# Migrations antes de subir e rebuild a cada alteração — o mesmo que o Run e o
# terminal fazem. Rodar `pnpm run dev` do pacote aqui serviria o `dist` que
# estivesse em disco, que é a outra origem conhecida de 502 neste projeto.
[services.development]
run = "node scripts/dev.mjs api"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
