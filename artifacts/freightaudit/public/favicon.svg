<!--
  O símbolo da marca, o mesmo de `src/components/layout/logotipo.tsx`.

  Aqui havia um quadrado laranja `#FF3C00` e nada mais — de uma paleta que o
  produto não usa em lugar nenhum. Ele é o que o navegador mostra na aba e o
  que o WhatsApp mostra no cartão pequeno do link, que são os dois lugares onde
  a marca aparece antes de alguém abrir o sistema.

  O caminho do símbolo é copiado do componente, não importado: um `.svg`
  estático não tem como importar de um `.tsx`, e o componente não tem como
  virar arquivo sem uma requisição a mais no caminho da primeira pintura.
  Mexeu no símbolo lá, mexa aqui — e em `../marca/og.html`.
-->
<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0F2A48"/>
  <defs>
    <linearGradient id="fc-favicon" gradientUnits="userSpaceOnUse" x1="36" y1="140" x2="144" y2="40">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4DA3FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(29 29) scale(3.05)" stroke-width="4.2" stroke-linecap="round">
    <path d="M 24.9 10.0 A 13 13 0 1 0 30.4 25.0" stroke="url(#fc-favicon)"/>
    <path d="M 10.0 21.2 L 16.4 27.6 L 30.8 11.9" stroke="url(#fc-favicon)" stroke-linejoin="round"/>
    <path d="M 35.5 6.0 L 33.8 14.5 L 27.2 8.7 Z" fill="url(#fc-favicon)"/>
  </g>
</svg>
